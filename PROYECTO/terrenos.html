<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terrenos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="CSS/terrenos.css">
</head>
<body>

  <div id="header"></div>
  <main class="terrenos">
    <ul class="listado">

      <li class="tarjeta">
        <a class="tarjeta__enlace" href="#guamuches">
          <img class="tarjeta__imagen" src="https://i.ibb.co/Rp0VNJdT/terreno1.jpg" alt="Maceta con cactus sobre una mesa de madera junto a una ventana">
          <div class="tarjeta__info">
            <h2 class="tarjeta__texto">
              Terreno Rústico 200m2<br>
              Paraje Los Guamuches<br>
              Zaachila, Oax
            </h2>
          </div>
        </a>
      
<button
  class="btn-carrito"
  data-id="terreno-1"
  data-nombre="Terreno Rústico 200m² - Zaachila"
  data-imagen="https://i.ibb.co/Rp0VNJdT/terreno1.jpg">
  🛒 Agregar al carrito
</button>
</li>
      <li class="tarjeta">
        <a class="tarjeta__enlace" href="#san-sebastian">
          <img class="tarjeta__imagen" src="https://i.ibb.co/ZztgVm30/terrenourbanizado.jpg" alt="Pasillo luminoso con cortinas de lino y lámpara de pie">
          <div class="tarjeta__info">
            <h2 class="tarjeta__texto">
              Terreno Urbanizado<br>
              400 m2, San Sebastián<br>
              Tutla, Oax.
            </h2>
          </div>
        </a>
      
<button class="btn-carrito"
  data-id="terreno-2"
  data-nombre="Terreno Urbanizado 400m² - San Sebastián Tutla"
  data-imagen="https://i.ibb.co/ZztgVm30/terrenourbanizado.jpg">
  🛒 Agregar al carrito
</button>
</li>
      <li class="tarjeta">
        <a class="tarjeta__enlace" href="#santo-domingo">
          <img class="tarjeta__imagen" src="https://i.ibb.co/k6XkRtrD/terreno2.jpg" alt="Florero blanco con flores secas frente a un sillón beige">
          <div class="tarjeta__info">
            <h2 class="tarjeta__texto">
              Terreno Comunal 200m2<br>
              Santo Domingo, Barrio<br>
              Alto, Etla, Oax.
            </h2>
          </div>
        </a>
      
<button class="btn-carrito"
  data-id="terreno-3"
  data-nombre="Terreno Comunal 200m² - Etla"
  data-imagen="https://i.ibb.co/k6XkRtrD/terreno2.jpg">
  🛒 Agregar al carrito
</button>
</li>
      <li class="tarjeta">
        <a class="tarjeta__enlace" href="#guamuches-2">
          <img class="tarjeta__imagen" src="https://i.ibb.co/JDWtVWz/terreno800.jpg" alt="Maceta con cactus sobre una mesa de madera junto a una ventana">
          <div class="tarjeta__info">
            <h2 class="tarjeta__texto">
              Terreno Rústico 200m2<br>
              Surcos Largos <br>
              San Antonio de la Cal, Oax
            </h2>
          </div>
        </a>
      
<button class="btn-carrito"
  data-id="terreno-4"
  data-nombre="Terreno Rústico 200m² - San Antonio de la Cal"
  data-imagen="https://i.ibb.co/JDWtVWz/terreno800.jpg">
  🛒 Agregar al carrito
</button>
</li>

    </ul>
  </main>

  <div id="footer"></div>
  <script src="Javascript/components.js"></script>
  <script src="Javascript/carrito.js"></script>
