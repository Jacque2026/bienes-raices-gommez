<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="CSS/casas.css">
</head>
<body>
  <div id="header"></div>

  <main class="casas">
    <ul class="listado">

      <li class="tarjeta">
        <a class="tarjeta__enlace" href="#abasolo-230">
          <img class="tarjeta__imagen" src="https://i.ibb.co/8DB2Q6v6/2casaniveles.jpg" alt="Maceta con cactus sobre una mesa de madera junto a una ventana">
          <div class="tarjeta__info">
            <h2 class="tarjeta__texto">
              Dos plantas<br>
              Abasolo 230, Centro<br>
              Oaxaca, Oax.
            </h2>
          </div>
        </a>
<button
    class="btn-carrito"
    type="button"
    data-id="casa-abasolo-230"
    data-nombre="Casa Abasolo 230, Oaxaca"
    data-imagen="https://i.ibb.co/8DB2Q6v6/2casaniveles.jpg">

    🛒 Agregar al carrito
</button>

      </li>

      <li class="tarjeta">
        <a class="tarjeta__enlace" href="#mina-720">
          <img class="tarjeta__imagen" src="https://i.ibb.co/xS6TgJsH/casita.jpg" alt="Pasillo luminoso con cortinas de lino y lámpara de pie">
          <div class="tarjeta__info">
            <h2 class="tarjeta__texto">
              Un nivel<br>
              Mina 720, Xoxocotlan<br>
              Oaxaca, Oax.
            </h2>
          </div>
        </a>
<button
    type="button"
    class="btn-carrito"
    data-id="casa-mina-720"
    data-nombre="Casa Mina 720, Xoxocotlán"
    data-imagen="https://i.ibb.co/xS6TgJsH/casita.jpg">

    🛒 Agregar al carrito
</button>

      </li>

      <li class="tarjeta">
        <a class="tarjeta__enlace" href="#constitucion-500">
          <img class="tarjeta__imagen" src="https://i.ibb.co/Txbg7hCk/casa-campo.jpg" alt="Florero blanco con flores secas frente a un sillón beige">
          <div class="tarjeta__info">
            <h2 class="tarjeta__texto">
              Casa campestre<br>
              Constitución 500, El Tule<br>
              Oaxaca, Oax.
            </h2>
          </div>
        </a>
<button
    type="button"
    class="btn-carrito"
    data-id="casa-constitucion-500"
    data-nombre="Casa Constitución 500, El Tule"
    data-imagen="https://i.ibb.co/Txbg7hCk/casa-campo.jpg">
    
    🛒 Agregar al carrito
</button>
      </li>

    </ul>
  </main>
  <div id="footer"></div>
<script src="Javascript/components.js"></script>
<script src="Javascript/carrito.js"></script>

</body>
</html>
