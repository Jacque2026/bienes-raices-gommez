<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Footer</title>

  <!-- Fuente Barlow (similar a la del diseño original) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&display=swap" rel="stylesheet">

  <!-- Hoja de estilos del pie de página -->
  <link rel="stylesheet" href="CSS/footer.css">
</head>
<body>

  <!-- PIE DE PÁGINA -->
  <footer class="footer">

    <!-- Espacio reservado para el logo.
         Cuando tengas la imagen, descomenta la etiqueta <img> y ajusta la ruta. -->
    <div class="footer__logo">
    <a href="home.html">
       <img src="https://i.ibb.co/m59snyMq/LOGOGOMMEZ2.png" width="300" height="150">
    </a>
    </div>

    <!-- BLOQUE 1: Dirección -->
    <address class="footer__address">
      Visitanos<br>
      Abasolo 120, Centro<br>
      Oaxaca, Oax.
    </address>

    <div class="footer_social"> <!-- BLOQUE 2: Texto "Siguenos en" -->
    <p class="footer__follow">Siguenos en</p>

    <!-- BLOQUE 3: Iconos de redes sociales -->
    <div class="footer__icons">

      <!-- Icono: Instagram (contorno, sin relleno) -->
      <a href="#" class="icon icon--instagram" aria-label="Instagram">
        <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
          <rect x="3" y="3" width="38" height="38" rx="10"/>
          <circle cx="22" cy="22" r="8.5"/>
          <circle cx="32.5" cy="11.5" r="1.2" fill="currentColor"/>
        </svg>
      </a>

      <!-- Icono: Facebook (círculo relleno con la "f") -->
      <a href="#" class="icon icon--facebook" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M13.5 21v-8h2.7l.4-3.2h-3.1V7.8c0-.9.3-1.5 1.6-1.5h1.6V3.4c-.3 0-1.2-.1-2.3-.1-2.4 0-4 1.4-4 4.1v2.4H7.7V13h2.7v8h3.1z"/>
        </svg>
      </a>

      <!-- Icono: cámara (círculo relleno) -->
      <a href="#" class="icon icon--camara" aria-label="Cámara">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M8.5 4l1.2-1.6h4.6L15.5 4H19a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3.5zM12 8.2a4.3 4.3 0 1 0 0 8.6 4.3 4.3 0 0 0 0-8.6zm0 2a2.3 2.3 0 1 1 0 4.6 2.3 2.3 0 0 1 0-4.6z" fill-rule="evenodd"/>
        </svg>
      </a>

    </div>
    </div>

  </footer>

</body>
</html>
